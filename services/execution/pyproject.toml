[project]
name = "aura-execution"
version = "0.0.3"
description = "Browser execution service for AURA (Month 1 Week 3)"
requires-python = ">=3.11"
dependencies = [
    "aura-browser",
    "aura-models",
    "aura-planner",
    "aura-skills",
]

[tool.uv.sources]
aura-browser = { workspace = true }
aura-models = { workspace = true }
aura-planner = { workspace = true }
aura-skills = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aura_execution"]
