[project]
name = "aura-planner"
version = "0.0.1"
description = "LangGraph planner for AURA (Month 1 Week 2)"
requires-python = ">=3.11"
dependencies = [
    "aura-models",
    "aura-skills",
    "langgraph>=0.2",
]

[tool.uv.sources]
aura-models = { workspace = true }
aura-skills = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aura_planner"]
