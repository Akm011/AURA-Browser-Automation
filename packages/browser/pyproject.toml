[project]
name = "aura-browser"
version = "0.2.1"
description = "Playwright browser execution engine for AURA"
requires-python = ">=3.11"
dependencies = [
    "aura-models",
    "playwright>=1.49",
    "structlog>=24.0",
]

[tool.uv.sources]
aura-models = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aura_browser"]
